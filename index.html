<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2F6FED" />
    <meta name="description" content="Central do Vendedor - CRM para vendedores externos ZAZ Vendas" />
    <title>Central do Vendedor - ZAZ CRM</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem('zaz_crm_tema');
          var escuro = salvo ? salvo === 'escuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (escuro) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
